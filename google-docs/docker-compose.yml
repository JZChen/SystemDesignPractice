version: '3.8'

services:
  google-docs-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: google-docs-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - CORS_ALLOWED_ORIGINS=*
    restart: unless-stopped
