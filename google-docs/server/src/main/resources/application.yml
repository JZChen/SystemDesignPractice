server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_HOST:127.0.0.1}

spring:
  application:
    name: google-docs-service

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  rate-limit:
    enabled: true
    requests-per-minute: 600
  document:
    max-length: 2097152 # 2 MB character cap for DoS protection
    max-operation-size: 32768 # 32 KB per operation
